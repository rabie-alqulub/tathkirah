<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تذكره · المراكز الإشرافية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Reem+Kufi:wght@600;700&display=swap">
<style>
:root{
  --bg:#EEF2F4; --card:#fff; --fg:#1D2E3B; --muted:#6A7C89; --line:#D9E1E6;
  --navy:#2F4F66; --navy2:#22394B; --gold:#C98A2B; --goldl:#FBF0DC;
  --ok:#1E8E4E; --okl:#E3F4EA; --bad:#B4433A; --badl:#F8E5E3; --info:#2D6FA3; --infol:#E3EEF7; --soft:#F5F8F9;
  --f-d:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif; --f-b:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root{--bg:#121B22;--card:#1B2730;--fg:#E6EDF2;--muted:#93A5B2;--line:#2C3B46;--navy:#7FA6C2;--navy2:#A9C6DB;--gold:#E3AE5B;--goldl:#3A2E1A;--ok:#4CC27F;--okl:#17331F;--bad:#E0776D;--badl:#3A1D1A;--info:#7DB3E0;--infol:#18293A;--soft:#16212A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-b);
  padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px}
header h1{font-family:var(--f-d);font-size:24px;margin:0;color:var(--navy2);flex:1}
header small{display:block;font:13px var(--f-b);color:var(--muted)}
.flow{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.flow span{white-space:nowrap;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.flow i{font-style:normal;color:var(--gold);align-self:center}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px}
.roles button{font:600 13px var(--f-b);border:0;background:none;color:var(--muted);border-radius:11px;padding:9px 4px;cursor:pointer;position:relative}
.roles button[aria-pressed=true]{background:var(--navy);color:var(--card)}
.roles .n{position:absolute;top:2px;left:4px;background:var(--gold);color:#fff;font-size:10.5px;border-radius:999px;min-width:17px;padding:0 4px;line-height:17px}
.who{display:flex;gap:8px;align-items:center}
.who label{font-size:13px;color:var(--muted);white-space:nowrap}
select,input[type=number],input[type=date],input[type=text],textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 10px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.card h2{font-family:var(--f-d);font-size:18px;margin:0 0 10px;color:var(--navy2);display:flex;align-items:center;gap:8px}
.card h2 .c{font:700 12px var(--f-b);background:var(--goldl);color:var(--gold);border-radius:999px;padding:1px 9px}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.empty{font-size:13.5px;color:var(--muted);text-align:center;padding:14px 0}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:9px 11px}
.row .m{flex:1;min-width:0}
.row b{display:block;font-size:14.5px}
.row .s{font-size:12.5px;color:var(--muted)}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--navy);flex:none}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.t-halaqa{background:var(--infol);color:var(--info)}
.t-center{background:var(--goldl);color:var(--gold)}
.t-batched{background:var(--infol);color:var(--navy)}
.t-done{background:var(--okl);color:var(--ok)}
.t-fail{background:var(--badl);color:var(--bad)}
.t-returned{background:var(--badl);color:var(--bad)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button.b{font:600 13px var(--f-b);border-radius:10px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.p{background:var(--navy);border-color:var(--navy);color:var(--card)}
button.g{background:var(--ok);border-color:var(--ok);color:#fff}
button.r{color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.day{border:1.5px solid var(--line);border-radius:14px;padding:10px;background:var(--soft);cursor:pointer;text-align:start;font:inherit;color:inherit}
.day[aria-pressed=true]{border-color:var(--navy);background:var(--infol)}
.day b{display:block;font-size:15px}
.day .s{font-size:12px;color:var(--muted)}
.day .k{font:700 20px var(--f-d);color:var(--gold)}
.batch{border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:8px}
.batch .h{display:flex;align-items:center;gap:8px}
.batch .h b{flex:1}
.grade{width:82px!important;text-align:center}
.toast{position:fixed;inset:auto 0 calc(16px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;background:var(--navy2);color:var(--card);padding:9px 16px;border-radius:12px;font-size:13.5px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.foot button{font:12px var(--f-b);background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer}
.note{font-size:12.5px;color:var(--bad)}
@media (max-width:420px){.roles button{font-size:12px}.days{gap:6px}.day{padding:8px}}
.login{max-width:380px;margin:8vh auto 0;display:flex;flex-direction:column;gap:12px}
.login h1{font-family:var(--f-d);font-size:30px;margin:0;color:var(--navy2);text-align:center}
.login p{margin:0;text-align:center;color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:13.5px;min-height:20px;text-align:center}
.me{font-size:12.5px;color:var(--muted);text-align:left}
.me button{font:12.5px var(--f-b);background:none;border:0;color:var(--bad);cursor:pointer;text-decoration:underline}
.busy{opacity:.55;pointer-events:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* إن كانت الواجهة مستضافة خارج Apps Script ضع هنا رابط النشر (exec). داخل Apps Script اتركه فارغاً. */
const API_URL = 'https://script.google.com/macros/s/AKfycbwBf3B_tFTkxY7r3Gtvfy9n8r64N0Tsuiwtned-glbnlyUTKRqIGMUnDgR6t28WBRLUJA/exec';

const DAYN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const ROLE={HALAQA:'مدير حلقة',SUP:'مشرف إداري',MAIN:'مدير المركز',EDU:'مشرف تعليمي'};
const ST={WAIT_SUP:'بانتظار المشرف الإداري',WAIT_MAIN:'بانتظار مدير المركز',SCHED:'مجدول',PASS:'اجتاز',FAIL:'لم يجتز',RET:'معاد للحلقة'};
const TAG={[ST.WAIT_SUP]:['عند المشرف الإداري','t-halaqa'],[ST.WAIT_MAIN]:['عند مدير المركز','t-center'],[ST.SCHED]:['مجدول للاختبار','t-batched'],[ST.PASS]:['اجتاز','t-done'],[ST.FAIL]:['لم يجتز','t-fail'],[ST.RET]:['أُعيد للحلقة','t-returned']};
const BOOKED=[ST.WAIT_MAIN,ST.SCHED,ST.PASS,ST.FAIL];
let D=null, TOKEN=null, eduDay=0;
try{TOKEN=localStorage.getItem('tadh_token')}catch(e){}

const $=id=>document.getElementById(id);
const by=(arr,id)=>(arr||[]).find(x=>x.id===id)||{};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2800);}
function hijri(s){try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long'}).format(new Date(s+'T12:00:00'));}catch(e){return s;}}
function dayName(s){return DAYN[new Date(s+'T12:00:00').getDay()];}
function dateLbl(s){return s?dayName(s)+' '+hijri(s):'';}
function nextDay(dow,fromIso){const d=new Date((fromIso||D.today)+'T12:00:00');while(d.getDay()!==dow)d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);}
function tag(st){const s=TAG[st]||[st,'t-halaqa'];return `<span class="tag ${s[1]}">${s[0]}</span>`;}
function stuName(id){return by(D.students,id).name||'—';}
function stuLine(n,showHal){const h=by(D.halaqat,n.halaqa);return `<div class="m"><b>${esc(stuName(n.student))}</b><span class="s">${esc(n.amount)}${showHal?' · '+esc(h.name):''}${n.date&&n.status===ST.WAIT_MAIN?' · موعده '+dateLbl(n.date):''}</span>${n.note&&n.status===ST.RET?`<div class="note">${esc(n.note)}</div>`:''}</div>`;}
const picked=scope=>[...(scope||document).querySelectorAll('.pick:checked')].map(c=>c.value);

/* ===== الاتصال بالخادم ===== */
function call(req){
  req.token=TOKEN;
  if(!API_URL&&window.google&&google.script&&google.script.run){
    return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e)).api(req));
  }
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(req)}).then(r=>r.json());
}
async function act(name,payload,btn){
  if(btn)btn.disabled=true;document.body.classList.add('busy');
  try{
    const r=await call(Object.assign({act:name},payload||{}));
    if(r.auth){logout(true);return;}
    if(!r.ok){toast(r.error||'تعذّر التنفيذ');return;}
    D=r;render();if(r.msg)toast(r.msg);
  }catch(e){toast('تعذّر الاتصال بالخادم، أعد المحاولة');}
  finally{document.body.classList.remove('busy');if(btn)btn.disabled=false;}
}

/* ===== الدخول ===== */
function vLogin(err){
  $('app').innerHTML=`<form class="login card" id="lf"><h1>تذكره</h1><p>المراكز الإشرافية</p>
    <label class="f">اسم المستخدم<input type="text" id="lu" autocomplete="username" dir="ltr" required></label>
    <label class="f">كلمة المرور<input type="password" id="lp" autocomplete="current-password" dir="ltr" required></label>
    <button class="b p" type="submit" style="padding:11px">دخول</button><div class="err" id="lerr">${esc(err||'')}</div></form>`;
  $('lf').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$('lerr').textContent='';
    try{const r=await call({act:'login',u:$('lu').value,p:$('lp').value});
      if(!r.ok){$('lerr').textContent=r.error;return;}
      TOKEN=r.token;try{localStorage.setItem('tadh_token',TOKEN)}catch(x){}D=r;render();}
    catch(x){$('lerr').textContent='تعذّر الاتصال بالخادم';}finally{b.disabled=false;}};
}
function logout(expired){if(!expired&&TOKEN)call({act:'logout'}).catch(()=>{});TOKEN=null;D=null;try{localStorage.removeItem('tadh_token')}catch(e){}vLogin(expired?'انتهت الجلسة، سجّل الدخول من جديد':'');}

/* ===== الهيكل ===== */
function render(){
  const u=D.user,title={[ROLE.HALAQA]:by(D.halaqat,u.ref).name,[ROLE.SUP]:by(D.centers,u.ref).name,[ROLE.MAIN]:'مدير المركز الرئيسي',[ROLE.EDU]:'المشرف التعليمي'}[u.role]||'';
  const V={[ROLE.HALAQA]:[vHalaqa,bindHalaqa],[ROLE.SUP]:[vSup,bindSup],[ROLE.MAIN]:[vMain,bindMain],[ROLE.EDU]:[vEdu,bindEdu]}[u.role];
  $('app').innerHTML=`<header><h1>المراكز الإشرافية<small>تذكره · ${esc(title)}</small></h1><div class="me">${esc(u.name)}<br><button type="button" id="out">خروج</button></div></header>
    <div class="flow"><span>مدير الحلقة يرشّح</span><i>←</i><span>المشرف الإداري يرفع</span><i>←</i><span>مدير المركز الرئيسي يجدول</span><i>←</i><span>المشرف التعليمي يختبر</span></div>
    <main class="wrap" style="gap:14px">${V?V[0]():'<div class="card empty">دور المستخدم غير معروف</div>'}</main>
    <div class="foot"><span>آخر تحديث: ${new Date().toLocaleTimeString('ar-SA',{hour:'numeric',minute:'2-digit'})}</span><button type="button" id="ref">تحديث</button></div>`;
  $('out').onclick=()=>logout();$('ref').onclick=()=>act('boot');
  if(V)V[1]();
}

/* ===== مدير الحلقة ===== */
function vHalaqa(){
  const h=by(D.halaqat,D.user.ref),c=by(D.centers,h.center),mine=D.noms;
  const busy=new Set(mine.filter(n=>[ST.WAIT_SUP,ST.WAIT_MAIN,ST.SCHED].includes(n.status)).map(n=>n.student));
  const all=D.students,free=all.filter(s=>!busy.has(s.id));
  return `<section class="card"><h2>ترشيح طالب للاختبار</h2>
    <p class="hint">تتبع ${esc(c.name)}، ومشرفه الإداري ${esc(c.sup)}. يوم الاختبار: ${DAYN[c.day]}.</p>
    ${free.length?`<div class="grid2"><label class="f">الطالب<select id="nStu">${free.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>
    <label class="f">مقدار الاختبار<select id="nAmt">${D.amounts.map(a=>`<option>${esc(a)}</option>`).join('')}</select></label></div>
    <div class="btns" style="margin-top:10px"><button class="b p" id="nAdd" type="button">ترشيح للمشرف الإداري</button></div>`:`<div class="empty">${all.length?'كل طلاب الحلقة مرشحون حالياً.':'أضف طلاب الحلقة أولاً من الأسفل.'}</div>`}
  </section>
  <section class="card"><h2>ترشيحات الحلقة <span class="c">${mine.length}</span></h2>
    <div class="list">${mine.length?mine.slice().reverse().map(n=>`<div class="row">${stuLine(n)}${n.grade!=null?`<span class="s">${n.grade}</span>`:''}${tag(n.status)}${n.status===ST.RET&&!busy.has(n.student)?`<button class="b" data-re="${n.id}" type="button">إعادة الترشيح</button>`:''}</div>`).join(''):'<div class="empty">لا توجد ترشيحات بعد.</div>'}</div>
  </section>
  <section class="card"><h2>طلاب الحلقة <span class="c">${all.length}</span></h2>
    <div class="grid2" style="align-items:end"><label class="f">اسم الطالب<input type="text" id="sName" placeholder="الاسم الثلاثي"></label><button class="b" id="sAdd" type="button" style="height:42px">إضافة طالب</button></div>
    <div class="list" style="margin-top:10px">${all.map(s=>`<div class="row"><div class="m"><b>${esc(s.name)}</b></div></div>`).join('')}</div>
  </section>`;
}
function bindHalaqa(){
  const a=$('nAdd');if(a)a.onclick=()=>act('nominate',{student:$('nStu').value,amount:$('nAmt').value},a);
  $('sAdd').onclick=e=>{const v=$('sName').value.trim();if(!v)return toast('اكتب اسم الطالب');act('addStudent',{name:v},e.target);};
  document.querySelectorAll('[data-re]').forEach(b=>b.onclick=()=>act('renominate',{id:b.dataset.re},b));
}

/* ===== المشرف الإداري ===== */
function vSup(){
  const c=by(D.centers,D.user.ref),hs=D.halaqat.filter(h=>h.center===c.id);
  const inbox=D.noms.filter(n=>n.status===ST.WAIT_SUP),sent=D.noms.filter(n=>n.status!==ST.WAIT_SUP);
  const ds=D.slots||[];
  return `<section class="card"><h2>ترشيحات واردة <span class="c">${inbox.length}</span></h2>
    <p class="hint">${esc(c.name)} · ${hs.length} حلقات. يوم المركز الذي حدده مدير المركز الرئيسي: ${DAYN[c.day]}.</p>
    ${inbox.length?`<div class="list">${inbox.map(n=>`<div class="row"><input type="checkbox" class="pick" value="${n.id}" checked aria-label="تحديد">${stuLine(n,true)}</div>`).join('')}</div>
    ${ds.length?`<div class="grid2" style="margin-top:10px;align-items:end"><label class="f">موعد الاختبار (أيام ${DAYN[c.day]} المتاحة)<select id="upDate">${ds.map(s=>`<option value="${s.date}">${dateLbl(s.date)} · متبقٍ ${s.left}</option>`).join('')}</select></label><button class="b p" id="up" type="button" style="height:42px">رفع لمدير المركز الرئيسي</button></div>
    <p class="hint" style="margin:6px 0 0">الحد ${D.cap} طلاب لكل يوم، والحجز لمن يرفع أولاً. اليوم الممتلئ يختفي من القائمة.</p>`:'<div class="empty">كل المواعيد القادمة ممتلئة.</div>'}`:'<div class="empty">لا توجد ترشيحات جديدة من الحلقات.</div>'}
  </section>
  <section class="card"><h2>حلقات المركز</h2><div class="list">${hs.map(h=>{const cnt=inbox.filter(n=>n.halaqa===h.id).length;
    return `<div class="row"><div class="m"><b>${esc(h.name)}</b><span class="s">${esc(h.manager)}</span></div>${cnt?`<span class="tag t-halaqa">${cnt} جديد</span>`:''}</div>`;}).join('')}</div></section>
  <section class="card"><h2>ما رفعته سابقاً <span class="c">${sent.length}</span></h2>
    <div class="list">${sent.length?sent.slice().reverse().map(n=>`<div class="row">${stuLine(n,true)}${n.grade!=null?`<span class="s">${n.grade}</span>`:''}${tag(n.status)}</div>`).join(''):'<div class="empty">لا شيء بعد.</div>'}</div>
  </section>`;
}
function bindSup(){
  const u=$('up');if(u)u.onclick=()=>{const ids=picked();if(!ids.length)return toast('حدد ترشيحاً واحداً على الأقل');
    const d=$('upDate').value,s=(D.slots||[]).find(x=>x.date===d);
    if(s&&ids.length>s.left)return toast('المتبقي في '+dateLbl(d)+' '+s.left+' مقاعد فقط، قلّل التحديد أو اختر موعداً آخر');
    act('raise',{ids,date:d},u);};
}

/* ===== مدير المركز الرئيسي ===== */
function vMain(){
  const used=[...new Set(D.centers.map(c=>c.day))].sort();
  const dup=used.filter(d=>D.centers.filter(c=>c.day===d).length>1);
  const booked=d=>(D.booked||{})[d]||0;
  const sched=`<section class="card"><h2>جدول المشرف التعليمي</h2>
    <p class="hint">يوم كل مركز اختبار ثابت، ولا يرى المشرف الإداري عند الرفع إلا مواعيد يومه.</p>
    <div class="list">${D.centers.map(c=>`<div class="row"><div class="m"><b>${esc(c.name)}</b><span class="s">${esc(c.sup)} · ${D.halaqat.filter(h=>h.center===c.id).length} حلقات</span></div>
      <select data-cday="${c.id}" style="width:auto" aria-label="يوم ${esc(c.name)}">${[0,1,2,3,4].map(d=>`<option value="${d}" ${d===c.day?'selected':''}>${DAYN[d]}</option>`).join('')}</select></div>`).join('')}</div>
    <label class="f" style="margin-top:10px;flex-direction:row;align-items:center;gap:8px">الحد اليومي لطلاب المشرف<input type="number" id="capIn" min="1" max="100" value="${D.cap}" style="width:80px"></label>
    ${dup.length?`<p class="note" style="margin:8px 0 0">تنبيه: يوم ${dup.map(d=>DAYN[d]).join(' و')} مُسند لأكثر من مركز.</p>`:''}
    <details style="margin-top:10px"><summary style="cursor:pointer;font-size:13.5px;color:var(--navy)">إضافة مركز اختبار جديد</summary>
      <div class="grid2" style="margin-top:8px"><label class="f">اسم المركز<input type="text" id="cName" placeholder="مركز الاختبار D"></label><label class="f">المشرف الإداري<input type="text" id="cSup" placeholder="أ. ..."></label></div>
      <div class="btns" style="margin-top:8px"><button class="b" id="cAdd" type="button">إضافة</button></div></details>
  </section>`;
  const waitSup=D.noms.filter(n=>n.status===ST.WAIT_SUP).length;
  const groups=D.centers.map(c=>{const ready=D.noms.filter(n=>n.center===c.id&&n.status===ST.WAIT_MAIN);if(!ready.length)return '';
    return [...new Set(ready.map(n=>n.date))].sort().map(d=>{const rs=ready.filter(n=>n.date===d);
      return `<div class="batch" data-grp="${c.id}_${d}"><div class="h"><b>${esc(c.name)}</b><span class="s">${dateLbl(d)} · ${rs.length} طلاب · محجوز ${booked(d)}/${D.cap}</span></div>
      ${rs.map(n=>`<div class="row"><input type="checkbox" class="pick" value="${n.id}" checked aria-label="تحديد">${stuLine(n,true)}<button class="b r" data-ret="${n.id}" type="button">إعادة</button></div>`).join('')}
      <div class="btns"><button class="b p" data-mk="${c.id}" data-d="${d}" type="button">إنشاء مجموعة ${dateLbl(d)}</button></div></div>`;}).join('');}).join('');
  const bs=D.batches.slice().sort((a,b)=>b.date.localeCompare(a.date));
  return sched+`<section class="card"><h2>ترشيحات مرفوعة من المراكز <span class="c">${D.noms.filter(n=>n.status===ST.WAIT_MAIN).length}</span></h2>
    ${waitSup?`<p class="hint">و${waitSup} ترشيحاً لم يرفعها المشرفون الإداريون بعد.</p>`:''}
    <div class="list">${groups||'<div class="empty">لا توجد ترشيحات مرفوعة من المشرفين الإداريين.</div>'}</div><div id="retBox"></div></section>
  <section class="card"><h2>مجموعات الاختبار <span class="c">${bs.length}</span></h2>
    <div class="list">${bs.length?bs.map(b=>batchCard(b,'main')).join(''):'<div class="empty">لم تُنشأ مجموعات بعد.</div>'}</div></section>`;
}
function batchCard(b,mode){
  const ns=D.noms.filter(n=>n.batch===b.id),done=ns.filter(n=>n.grade!=null).length,c=by(D.centers,b.center),draft=b.status==='مسودة';
  const st=draft?'<span class="tag t-halaqa">مسودة</span>':done===ns.length&&ns.length?'<span class="tag t-done">اكتملت</span>':'<span class="tag t-center">عند المشرف التعليمي</span>';
  let body;
  if(mode==='edu'){
    body=ns.map(n=>`<div class="row">${stuLine(n,true)}<input type="number" class="grade" min="0" max="100" inputmode="numeric" placeholder="الدرجة" data-g="${n.id}" value="${n.grade??''}" aria-label="درجة ${esc(stuName(n.student))}">${n.grade!=null?tag(n.status):''}</div>`).join('')+
      `<div class="btns"><button class="b g" data-sv="${b.id}" type="button">حفظ النتائج</button></div>`;
  }else{
    body=ns.map(n=>`<div class="row">${stuLine(n,true)}${n.grade!=null?`<span class="s">${n.grade}</span>${tag(n.status)}`:''}${draft?`<button class="b" data-rm="${n.id}" type="button">إخراج</button><button class="b r" data-ret="${n.id}" type="button">إعادة</button>`:''}</div>`).join('')+
      (draft?`<div class="btns"><button class="b p" data-send="${b.id}" type="button">إرسال للمشرف التعليمي</button><button class="b r" data-del="${b.id}" type="button">حذف المجموعة</button></div>`:'');
  }
  return `<div class="batch" data-b="${b.id}"><div class="h"><b>${esc(c.name||b.center)}</b><span class="s">${dateLbl(b.date)} · ${ns.length} طلاب</span>${st}</div>${body}</div>`;
}
function bindMain(){
  document.querySelectorAll('[data-cday]').forEach(s=>s.onchange=()=>act('setCenterDay',{center:s.dataset.cday,day:+s.value}));
  $('capIn').onchange=e=>act('setCap',{value:+e.target.value});
  $('cAdd').onclick=e=>{const n=$('cName').value.trim(),s=$('cSup').value.trim();if(!n||!s)return toast('اكتب اسم المركز والمشرف الإداري');act('addCenter',{name:n,sup:s},e.target);};
  document.querySelectorAll('[data-mk]').forEach(x=>x.onclick=()=>{const key=x.dataset.mk+'_'+x.dataset.d,ids=picked(document.querySelector(`[data-grp="${key}"]`));
    if(!ids.length)return toast('حدد طالباً واحداً على الأقل');act('makeBatch',{center:x.dataset.mk,date:x.dataset.d,ids},x);});
  document.querySelectorAll('[data-send]').forEach(x=>x.onclick=()=>act('sendBatch',{id:x.dataset.send},x));
  document.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>act('removeFromBatch',{id:x.dataset.rm},x));
  document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>act('deleteBatch',{id:x.dataset.del},x));
  document.querySelectorAll('[data-ret]').forEach(b=>b.onclick=()=>{const n=by(D.noms,b.dataset.ret);
    $('retBox').innerHTML=`<div class="batch" style="margin-top:10px"><b>سبب إعادة ترشيح ${esc(stuName(n.student))}</b><textarea id="retNote" rows="2" placeholder="مثال: يحتاج مراجعة قبل الاختبار"></textarea><div class="btns"><button class="b p" id="retOk" type="button">إعادة للحلقة</button><button class="b" id="retNo" type="button">إلغاء</button></div></div>`;
    $('retBox').scrollIntoView({behavior:'smooth',block:'center'});$('retNote').focus();$('retNo').onclick=()=>$('retBox').innerHTML='';
    $('retOk').onclick=e=>act('returnNom',{id:n.id,note:$('retNote').value.trim()},e.target);});
}

/* ===== المشرف التعليمي ===== */
function vEdu(){
  const base=nextDay(0);
  const days=[...new Set(D.centers.map(c=>c.day))].sort();
  const week=days.map(d=>{const date=nextDay(d,base),cs=D.centers.filter(c=>c.day===d);
    const bs=D.batches.filter(b=>b.date===date&&cs.some(c=>c.id===b.center));
    return {d,date,cs,bs,cnt:bs.reduce((a,b)=>a+D.noms.filter(n=>n.batch===b.id).length,0)};});
  if(!week.length)return '<section class="card empty">لا توجد مراكز اختبار.</section>';
  const i=Math.min(eduDay,week.length-1),w=week[i];
  const pending=D.batches.filter(b=>!week.some(x=>x.bs.includes(b))&&D.noms.some(n=>n.batch===b.id&&n.grade==null)).sort((a,b)=>a.date.localeCompare(b.date));
  const total=D.noms.filter(n=>n.status===ST.PASS||n.status===ST.FAIL),pass=total.filter(n=>n.status===ST.PASS).length;
  return `<section class="card"><h2>جدول الأسبوع</h2>
    <p class="hint">كما نظّمه مدير المركز الرئيسي: يوم لكل مركز اختبار. درجة الاجتياز ${D.pass}.</p>
    <div class="days" style="grid-template-columns:repeat(${Math.min(week.length,3)},1fr)">${week.map((x,k)=>`<button type="button" class="day" data-day="${k}" aria-pressed="${k===i}"><span class="s">${DAYN[x.d]} ${hijri(x.date)}</span><b>${esc(x.cs.map(c=>c.name.replace('مركز الاختبار ','مركز ')).join(' + '))}</b><span class="k">${x.cnt}</span> <span class="s">طالب</span></button>`).join('')}</div>
  </section>
  <section class="card"><h2>${DAYN[w.d]} · ${esc(w.cs.map(c=>c.name).join(' + '))}</h2>
    <p class="hint">المشرف الإداري: ${esc(w.cs.map(c=>c.sup).join('، '))}</p>
    <div class="list">${w.bs.length?w.bs.map(b=>batchCard(b,'edu')).join(''):'<div class="empty">لم يرسل مدير المركز الرئيسي مجموعة لهذا اليوم بعد.</div>'}</div>
  </section>
  ${pending.length?`<section class="card"><h2>مجموعات أخرى لم تكتمل نتائجها <span class="c">${pending.length}</span></h2><div class="list">${pending.map(b=>batchCard(b,'edu')).join('')}</div></section>`:''}
  <section class="card"><h2>الإحصاء</h2><div class="grid2">
    <div class="row"><div class="m"><span class="s">المختبَرون</span><b>${total.length}</b></div></div>
    <div class="row"><div class="m"><span class="s">نسبة الاجتياز</span><b>${total.length?Math.round(pass/total.length*100)+'%':'—'}</b></div></div></div></section>`;
}
function bindEdu(){
  document.querySelectorAll('[data-day]').forEach(x=>x.onclick=()=>{eduDay=+x.dataset.day;render();});
  document.querySelectorAll('[data-sv]').forEach(x=>x.onclick=()=>{const bx=document.querySelector(`[data-b="${x.dataset.sv}"]`),grades={};let bad=false;
    bx.querySelectorAll('[data-g]').forEach(inp=>{const v=inp.value.trim();if(v!==''&&!(+v>=0&&+v<=100))bad=true;grades[inp.dataset.g]=v===''?'':+v;});
    if(bad)return toast('الدرجة بين 0 و100');act('saveGrades',{batch:x.dataset.sv,grades},x);});
}

/* ===== البدء ===== */
if(TOKEN){$('app').innerHTML='<div class="empty" style="margin-top:20vh">جاري التحميل...</div>';
  call({act:'boot'}).then(r=>{if(!r.ok){logout(true);return;}D=r;render();}).catch(()=>vLogin('تعذّر الاتصال بالخادم'));}
else vLogin();
</script>
</body>
</html>
